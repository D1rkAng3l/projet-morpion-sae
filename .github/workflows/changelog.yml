name: Mise à jour automatique du CHANGELOG

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  changelog:

    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest

    steps:

      - name: Récupération du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configuration Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ------------------------------------------------------
      # DATE RÉELLE DU PUSH
      #
      # On utilise Europe/Paris pour éviter qu'un push
      # effectué après minuit en France soit daté du jour
      # précédent à cause de l'UTC de GitHub Actions.
      # ------------------------------------------------------

      - name: Détermination de la date du push
        run: |
          echo "PUSH_DATE=$(TZ=Europe/Paris date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Mise à jour du CHANGELOG
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python3 scripts/update_changelog.py

      - name: Vérification des modifications
        id: changes
        run: |
          if git diff --quiet CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit automatique du CHANGELOG
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add CHANGELOG.md
          git commit -m "chore: mise à jour automatique du changelog [skip ci]"
          git push origin HEAD:main